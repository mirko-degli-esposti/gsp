# qui perche' altri comuni potrebbero averli.
#   FO Isole Faroe · SE Svezia (solo nomi) · UY Uruguay (solo nomi)

note:
  - >-
    `Norvegia: "NO"` va fra virgolette: senza, YAML lo legge come il
    booleano false. E' la stessa trappola dei campi `usabile_per` senza
    virgola.
  - >-
    la profondita' varia molto: Filippine 50 cognomi, Albania 46, Cina
    40, ma Romania 12, Moldova 15, India 7, Bangladesh 6. Con dieci
    cognomi su 4.750 rumeni la collisione in un campione da venti e'
    circa il 10% — accettabile — ma in uno da centoventi e' quasi certa.
