# Raccordo fra i nomi di paese della popolazione e i codici ISO-3166-2
# del dataset `popular-names-by-country`.
#
# SOLO i paesi che hanno NOMI E COGNOMI insieme. Il dataset copre 106
# paesi per i nomi propri e 75 per i cognomi, ma l'intersezione e' 65: e
# un nome arabo con un cognome fiorentino — «Mohamed Innocenti» — e'
# PEGGIO di due nomi italiani, perche' segnala l'errore invece di
# nasconderlo. Se manca il cognome non si usa nemmeno il nome.
#
# Copertura misurata su Parma (34.429 stranieri, 136 paesi distinti):
# 59,6% degli stranieri ha un paese coperto. Il 40,4% resta al fallback
# italiano, ed e' concentrato: Nigeria 6,7%, Tunisia 6,0%, Marocco 3,7%,
# Ghana 3,5%, Pakistan 3,0%, Costa d'Avorio 2,9%, Senegal 2,2%, Camerun
# 2,2% — cioe' il mondo arabo e l'Africa subsahariana, che ne' Wikipedia
# ne' gli istituti statistici nazionali documentano.
schema: 1
fonte: popular_names_by_country
verificato: 2026-08-04

# nome del paese nella popolazione -> ISO-3166-2 nel dataset
paesi:
