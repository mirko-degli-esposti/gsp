      Comune di Firenze - Direzione Generale - Servizio Pianificazione,
      Controllo e Statistica
    contatto: statistica@comune.fi.it
    titolo: Cognomi residenti - Anno 2013
    url: "http://opendata.comune.fi.it/?q=metarepo/datasetinfo&id=cognomi-residenti-2013"
    data_accesso: 2026-08-02
    licenza: CC-BY-4.0
    attribuzione: >-
      Comune di Firenze, "Cognomi residenti - Anno 2013",
      opendata.comune.fi.it, CC BY 4.0
    aggiornamento: notPlanned      # dal metadato: dataset congelato
    metadati: firenze_cognomi_2013.xml
    file: firenze_cognomi_2013.csv
    sha256: aeedad53c604b707d096289c6ac289de3c2a730924cf8d7ebe34c0c4b67e343d
    archiviazione: git
    universo: >-
      residenti anagrafici del comune di Firenze, tutte le eta',
      italiani e stranieri, un record per persona
    unita: individuo
    copertura: {geo: "048017", tempo: 2013}
    normalizzatore: distribuzione_csv
    opzioni: {sep: ","}
    dimensioni: []
    n_dichiarato: null
    n_misurato: 375371
    modalita: 66353
    anomalie:
      - 2 record con cognome vuoto (75 + 33 persone), esclusi
      - 4 coppie con spazio in testa (" DE LUCIA", " ROCCO"), fuse
      - particelle nobiliari in minuscolo ("de VIVO"), preservate
      - file ASCII puro; accenti gia' appiattiti a monte
      - byteSize dichiarato 875.4 Kbytes = 875465 byte, coincide
    bias: >-
      include gli stranieri con la composizione toscana (HU al rango 13);
      strato hapax al 51% dei tipi, rinnovato per ~1/6 ogni anno
    usabile_per: [cognome_italiano, coda_zipf]
    non_usabile_per: [cognome_straniero, geografia_emilia]

