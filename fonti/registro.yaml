# Fonti locali per il paese di cittadinanza (margine B dell'IPF).
#
# Da appendere UNA VOLTA SOLA a fonti/registro.yaml. Forma sicura:
#   grep -q "id: brescia_cittadinanza" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/schede_opendata.yaml" >> fonti/registro.yaml
#
# PRINCIPIO: la configurazione operativa (loader, livello geografico,
# encoding, override dei nomi, mappe di riconciliazione, alias dei paesi)
# vive gia' in gsp.common.COMUNI[<cod>]["opendata_paese"]. Il registro NON
# la riscrive: la referenzia con `parametri_da`, e --verifica controlla
# che il riferimento regga. Riscriverla darebbe due dichiarazioni della
# stessa cosa, destinate a divergere in silenzio.
#
# Qui c'e' solo cio' che a common.py manca: provenienza, licenza,
# data di accesso, universo, limiti d'uso.
#
# Le altre cinque schede si ricavano da questa cambiando id, ente,
# percorso, tipo (`file` se non ci sono istanze), normalizzatore, tier
# e universo. I codici: 034027 Parma (tier 3), 035033 Reggio (tier 1,
# encoding latin-1, fonte 2013), 037006 Bologna (tier 2, Parquet),
# 039014 Ravenna (XLS, due annate), 040012 Forli' (XLSX, 41 unita' -> 21).

  - id: brescia_cittadinanza_quartieri
    tipo: multi_istanza
    ente: Comune di Brescia
    titolo: Cittadinanze straniere per quartiere
    url: DA_VERIFICARE          # pagina con i 33 link, uno per quartiere
    data_accesso: 2025-07-06    # dai timestamp dei file, 16:01-16:05
    licenza: DA_VERIFICARE      # portale comunale: nessuna regola generale,
                                # va letta la pagina (CC-BY? IODL 2.0? nulla?)
    archiviazione: locale
    percorso: data/opendata/017029/cittadinanza/{istanza}.csv
    chiave_istanza: quartiere
    parametri_da: common.COMUNI.017029.opendata_paese
    tier: 1
    universo: >-
      residenti per CITTADINANZA e quartiere, italiani inclusi: la riga
      ITALIA e' presente nel file e viene filtrata a valle da
      opendata_paese.py (riga 97). I totali per quartiere sono quindi
      popolazione totale, non stranieri. Fonte ANAGRAFICA comunale, di
      data diversa dal censimento. Non distingue il sesso: lo ricostruisce
      l'IPF dal margine comunale. E' il margine B dell'IPF, COMPLEMENTARE
      e non alternativo al censimento (margine A): il censimento porta i
      ~150 paesi, i livelli corretti e il sesso, la fonte locale porta la
      geografia. Il gruppo residuale e' il complemento dei paesi nominati
      IN QUEL QUARTIERE, quindi cambia da file a file: le modalita' vanno
      da 8 (Caionvico) a 33 (Centro storico nord).

    unita: individuo
    normalizzatore: distribuzione_csv
    opzioni: {sep: ",", col_chiave: cittadinanze, col_peso: num}
    usabile_per: [margine_B_ipf, geografia_paese_tier1]
    usato_da: [opendata_paese.py]
    non_usabile_per: [sesso, popolazione_italiana, conteggi_assoluti]


