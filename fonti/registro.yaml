    url_specifiche: https://www.agenziaentrate.gov.it/portale/documents/20143/8411843/ALLEGATO+-+SPECIFICHE+TECNICHE.pdf
    url_tracciato: https://www.anncsu.gov.it/.allegati/metadata_indirizzario.json
