    licenza_uri: https://creativecommons.org/licenses/by/4.0/
    attribuzione: >-
      ANNCSU - Archivio Nazionale dei Numeri Civici delle Strade Urbane,
      Istat e Agenzia delle Entrate, open data ex Reg. (UE) 2023/138
    nota_licenza: >-
      il portale ANNCSU non dichiara una stringa di licenza, ma due vie
      indipendenti convergono su CC-BY-4.0.
      (1) Il Regolamento di esecuzione (UE) 2023/138, che attua la
      Direttiva (UE) 2019/1024, classifica gli indirizzi fra le "serie di
      dati di elevato valore" nella categoria dati geospaziali e ne
      impone il rilascio in formato aperto, con CC-BY-4.0 o equivalente.
      (2) L'art. 52 c.2 del D.Lgs 82/2005 (CAD) stabilisce l'open by
      default per i dati delle PA privi di licenza esplicita.
      AgID classifica ANNCSU nel proprio cruscotto come "Open Data ai
      sensi del Reg. UE 2023/138 (HVD)". Verificato il 4/8/2026.
    nota_riservatezza: >-
      le Specifiche tecniche vigenti sono state adottate con Provvedimento
      interdirigenziale Istat-Agenzia delle Entrate del 12 dicembre 2024,
      PREVIO PARERE POSITIVO DEL GARANTE per la protezione dei dati
      personali. La pubblicazione aperta dei civici georeferenziati e'
      stata quindi vagliata dall'autorita' competente: non e'
      un'inferenza nostra sulla natura del dato.
      Questo NON esaurisce la questione a valle: la congiunzione fra un
      civico reale e attributi sintetici sensibili in un file scaricabile
      e' un problema nostro, non della fonte. Risolto il 4/8/2026: il
      bundle pubblico non contiene via ne' civico e le coordinate sono un
      punto casuale dentro la sezione (regime pubblico di default in
      to_parquet). Vedi note/piano_trattamento_v1.md §4.2.
    archiviazione: locale
    percorso: data/geodata/{istanza}/indirizzario*.zip
    chiave_istanza: regione
    parametri_da: common.REGIONI
    universo: >-
      tutti gli accessi esterni (numeri civici) certificati dai Comuni e
      conferiti in ANNCSU, per regione, con coordinate. Aggiornamento
      mensile; la data di creazione e' nel nome del file (20260703).
      Diciotto campi documentati nel tracciato JSON: fra gli altri
      ODONIMO (DUG+DUF), CIVICO, ESPONENTE, SPECIFICITA (la numerazione
      rosso/nero di Firenze e Genova), COORD_X/Y_COMUNE, QUOTA e METODO.
      L'archivio contiene UN SOLO CSV, da 170 a 240 MB per regione.
    unita: accesso esterno
    normalizzatore: archivio_zip
    anomalie:
      - >-
        le coordinate sono in ETRF2000 gradi decimali (realizzazione
        italiana di ETRS89), mentre lo shapefile delle sezioni e' in
        WGS84. La differenza e' sotto il metro alle nostre latitudini e
        irrilevante per l'aggancio civico-sezione, ma va dichiarata.
      - >-
        `METODO` dice come il Comune ha attribuito le coordinate: 1 e 3
        sono accurate sotto i 5 m, 2 e 4 sopra, 5 e' derivazione indiretta
        dal Portale per i Comuni. NON e' stato usato per filtrare:
        l'aggancio alla sezione tollera errori di qualche metro, ma per
        usi piu' fini andrebbe guardato.
      - >-
        i dati comprendono accessi di tipo SNC, privi di numero civico
        standard, inseriti dai Comuni fra il 2014 e il 2016.
      - >-
        come per le sezioni, il registro verifica lo ZIP e non l'estratto
        che la pipeline legge.
    bias: >-
      la copertura dipende dal conferimento dei Comuni: i capoluoghi e i
      comuni sopra i 20.000 abitanti hanno conferito nell'ambito della
      Rilevazione dei Numeri Civici, gli altri progressivamente. Al
      31/03/2026 sono 4.304 i Comuni con TUTTI i civici georeferenziati
      su ~7.900: per i restanti la copertura geografica e' parziale, e
      questo si riflette nell'aggancio civico-sezione.
    usabile_per: [civici_georeferenziati, indirizzi_sintetici]
    usato_da: [scripts/vincoli/join_civici_sezioni.py]
    non_usabile_per: [conteggi_di_popolazione, residenti]
# Titoli di studio — le due fonti complementari.
#
# Richiede normalizzatori.py (32936) con `classificazione_xlsx`.
#
#   grep -q "id: claist_2026" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/schede_titoli.yaml" >> fonti/registro.yaml
#
#   sha256sum data/istruzione/CLAIST_2026.xlsx      -> DA_CALCOLARE
#   sha256sum data/censimento_2011/*.zip            -> DA_CALCOLARE
#   python -m gsp.fonti --impronta claist_2026
#   python -m gsp.fonti --impronta cens2011_titolo_studio
#   python -m gsp.fonti --verifica
#
# LE DUE FONTI SONO COMPLEMENTARI, ed e' la stessa divisione del lavoro
# fra margine A e margine B in opendata_paese:
#   CLAIST         quali titoli esistono, come si chiamano, per quale
#                  coorte erano ottenibili, e come si raccordano ai
#                  livelli ISCED
#   DICA_TITSTUDIO quante persone li possedevano, per sesso, eta' e
#                  territorio
# Nessuna delle due basta da sola.

  - id: claist_2026
    ente: ISTAT
    titolo: >-
      CLAIST 2026 - Mappa dei percorsi di istruzione e dei titoli di
      studio italiani
    url: DA_VERIFICARE
    url_nota_metodologica: DA_VERIFICARE
    data_accesso: 2026-08-04
    licenza: CC-BY-4.0
    nota_licenza: >-
      licenza generale del sito ISTAT ("salvo diversa indicazione", note
      legali): la pagina CLAIST non ne dichiara una propria. Inferita,
      non letta.
    attribuzione: >-
      ISTAT, "CLAIST 2026 - Mappa dei percorsi di istruzione e dei titoli
      di studio italiani", CC BY 4.0
    archiviazione: locale
    percorso: data/istruzione/CLAIST_2026.xlsx
    sha256: a469633858d7e2f5ba77b412a290800e2a51c31543280cc00da50a04039d6cef
    metadati: data/istruzione/Nota-metodologica-CLAIST-2025.pdf
    copertura: {geo: "IT", tempo: "storicizzata"}
    universo: >-
      tutti i percorsi di istruzione e formazione italiani, ATTUALI E
      PASSATI, dai servizi per l'infanzia al dottorato. Sostituisce la
      Classificazione dei titoli di studio del 2003.
      Struttura gerarchica su SEI livelli: 61 tipologie di programma al
      primo, circa 20.000 percorsi al sesto, codificati in un
      COD_CLAIST a 18 digit (3-2-2-4-4-3). Sedici fogli, 29.282 righe in
      tutto.
      Il registro normalizza il foglio "Schema sintetico 2026" — 104
      righe, 42 titoli — che e' il livello utile per attribuire un titolo
      a un individuo sintetico: non seimila corsi, non sei categorie.
      Il livello 2 e' l'ORDINAMENTO, cioe' il decreto di riferimento: e'
      questo che rende la mappa storicizzata e permette di sapere quali
      titoli erano ottenibili in quale periodo.
    unita: titolo di studio
    normalizzatore: classificazione_xlsx
    opzioni: {foglio: "Schema sintetico 2026", col_chiave: codice_titolo,
              col_definizione: TITOLO_CONSEGUITO,
              extra: [ISCED_A_3, cod_livello_1_2, livello_1, livello_2,
                      ISCED_P_3]}
    anomalie:
      - >-
        39 codici titolo ma 42 denominazioni distinte: lo stesso codice
        porta nomi diversi perche' la denominazione e' cambiata nel tempo
        mentre il titolo e' rimasto lo stesso. CTS_7_10_20 e' sia LAUREA
        SPECIALISTICA sia LAUREA MAGISTRALE. Verificato 4/8/2026.
      - >-
        104 righe per 42 titoli: la molteplicita' e' la
        STORICIZZAZIONE. "DIPLOMA DI MATURITA' (ANTE 2010)" compare 13
        volte, una per ogni tipo di scuola che lo rilasciava — liceo,
        istituto tecnico, magistrale, d'arte, corsi serali.
      - >-
        i codici ISCED_A_3 sono 12 e mappano quasi direttamente sulle sei
        categorie di `istruzione` della popolazione: 20/100 elementare,
        244 media, 344/353/354 diploma, 660 laurea_o_its (che contiene
        SIA la laurea triennale SIA il diploma ITS Academy, esattamente
        come la nostra categoria), 760/860 post_laurea. Il raccordo va
        comunque dichiarato e verificato come partizione.
      - >-
        il vincolo TEMPORALE e' dentro i titoli stessi: "DIPLOMA DI
        MATURITA' (ANTE 2010)" contro "DIPLOMA DI SUPERAMENTO DELL'ESAME
        DI STATO", "DIPLOMA DI LAUREA DEL VECCHIO ORDINAMENTO" contro
        "LAUREA DI 1° LIVELLO (TRIENNALE)" che esiste solo dal D.M.
        509/99. Non serve imporre la coorte dall'esterno.
      - >-
        "LICENZA MEDIA (INCLUSA LICENZA DI AVVIAMENTO PROFESSIONALE)":
        l'avviamento professionale, che esisteva solo prima del 1962, e'
        gia' fuso nella licenza media a questo livello. Il rischio di
        generare un venticinquenne con l'avviamento non esiste.
    bias: >-
      e' un VOCABOLARIO, non una distribuzione: dice quali titoli
      esistono, non quante persone li hanno. Le frequenze vengono da
      cens2011_titolo_studio.
      Non include i vecchi corsi delle Scuole dirette a fini speciali e
      parauniversitarie, i TFA di sostegno, i corsi per mediatori
      linguistici. Per la Formazione professionale regionale e per i
      Master di I e II livello il dettaglio dei corsi e' rinviato a una
      versione successiva.
    usabile_per: [vocabolario_titoli, storicizzazione, raccordo_isced,
                  gruppi_disciplinari_mur]
    non_usabile_per: [frequenze, conteggi, geografia]

  - id: cens2011_titolo_studio
    ente: ISTAT
    titolo: >-
      Titolo di studio della popolazione residente di 6 anni e piu' -
      Censimento della popolazione 2011
    url: DA_VERIFICARE
    url_download: https://esploradati.istat.it/databrowser/DWL/censtatv5db/Popolazione/DICA_TITSTUDIO-data.zip
    dataflow: DF_BULK_CPO2011_DICA_TITSTUDIO
    data_accesso: 2026-08-04
    licenza: CC-BY-4.0
    attribuzione: >-
      ISTAT, "15° Censimento generale della popolazione e delle
      abitazioni 2011", CC BY 4.0
    archiviazione: locale
    percorso: data/censimento_2011/DICA_TITSTUDIO-data.zip
    sha256: 95b2f7a520de3ecf1e0236989b500bf09da61f7bab87707606c2b6a4ccbb0ead
    copertura: {geo: "IT", tempo: 2011}
    universo: >-
      popolazione residente di SEI ANNI E PIU' per titolo di studio,
      sesso, eta' e territorio, al censimento 2011. L'universo a 6 anni
      copre anche i bin 9-14 della nostra popolazione, che le rilevazioni
      sulle forze di lavoro (15+) escluderebbero.
      Circa 457 modalita' di titolo, in una gerarchia codificata a cinque
      cifre: la prima e' il ramo (1 elementare, 2 media, 3 qualifica 2-3
      anni, 4 maturita' 4-5 anni, 5 terziario non universitario, 6
      diploma universitario v.o., 7 laurea, 0 laurea magistrale), le
      successive scendono al tipo di scuola e all'indirizzo. I codici che
      finiscono in 00 sono totali di ramo.
      Il ramo 4 ha 27 voci ed e' il livello giusto per una biografia:
      "istituto tecnico per geometri", "liceo classico", "istituto
      professionale per i servizi alberghieri".
    unita: individuo residente
    normalizzatore: archivio_zip
    anomalie:
      - >-
        i file dentro lo zip sono in UTF-16 con BOM e separatore `|`,
        SENZA riga di intestazione. Il quinto campo dei codebook e' un
        progressivo di ordinamento (10, 20, 30...), NON il livello
        gerarchico: la gerarchia sta nel codice.
      - >-
        lo stesso indirizzo compare in due rami con etichetta quasi
        identica: 30101 e 40101 sono entrambi "diploma di qualifica di
        istituto professionale agrario", ma il primo e' la qualifica
        triennale e il secondo il diploma quinquennale. Guardarli per
        descrizione li farebbe sembrare duplicati: e' il codice a
        distinguerli.
      - >-
        lo zip contiene TRE versioni degli stessi dati — solo codici (15
        MB), codici e descrizioni in italiano (58 MB) e in inglese (57
        MB) — piu' i codebook per dimensione in METADATA/. Si usa la
        versione a soli codici con i codebook a fianco, come per i
        microdati di Parma.
      - >-
        il dataflow SDMX e' di tipo ONLY_FILE con VIRTUALDSD: NON e'
        interrogabile per dimensioni. L'URL dello zip sta
        nell'annotazione ATTACHED_DATA_FILES della struttura. Non
        consuma il limite di 4 query al minuto.
    bias: >-
      e' il censimento 2011, quindi ha QUINDICI ANNI. Il trasferimento
      per coorte e' pulito per chi era gia' uscito dal sistema formativo
      — sopra i 35 anni nel 2011, cioe' sopra i 48 oggi — mentre per le
      coorti giovani il titolo puo' essere cambiato dopo: chi aveva 22
      anni nel 2011 poteva laurearsi in seguito. I titoli istituiti dopo
      il 2011 (ITS Academy riformati nel 2022-2023, nuove classi di
      laurea del 2024) sono per costruzione assenti.
      Non esiste una tavola equivalente sul censimento permanente: il
      catalogo ISTAT, alla voce "titolo di studio", restituisce solo
      rilevazioni sulle FORZE DI LAVORO, campionarie e con universo 15+
      (verificato 4/8/2026).
    usabile_per: [frequenze_titoli, condizionamento_per_sesso_eta]
    usato_da: []
    non_usabile_per: [titoli_post_2011, coorti_giovani_terziario]
# Repertorio onomastico per paese — cognomi e nomi stranieri.
#
# Richiede normalizzatori.py (35385) con `onomastico_csv`,
# nomi_init.py (11919) con `traduci`, piu' i due YAML.
#
#   grep -q "id: popular_names_cognomi" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/scheda_popular_names.yaml" >> fonti/registro.yaml
#
#   sha256sum data/nomi/popular-names/*.csv
#   python -m gsp.fonti --impronta popular_names_cognomi
#   python -m gsp.fonti --impronta popular_names_nomi
#   python -m gsp.fonti --verifica

  - id: popular_names_cognomi
    ente: Andy Boothe (sigpwned)
    titolo: Popular Names by Country Dataset - cognomi
    url: https://github.com/sigpwned/popular-names-by-country-dataset
    url_documentazione: https://sigpwned.com/2023/07/15/popular-names-by-country-dataset/
    data_accesso: 2026-08-04
    licenza: CC0-1.0
    licenza_uri: https://creativecommons.org/publicdomain/zero/1.0/
    attribuzione: >-
      Andy Boothe, "Popular Names by Country Dataset", CC0. I dati
      originali provengono da Wikipedia, "Lists of most common surnames",
      luglio 2023.
    nota_licenza: >-
      CC0 dichiarata dall'autore, con provenienza esplicita: «Data is
      pulled from en.wikipedia.org/wiki/Lists_of_most_common_surnames the
      week of Jul 8, 2023». Wikipedia e' CC-BY-SA, ma i cognomi piu'
      diffusi di un paese sono FATTI, non opere: la CC0 sul dato estratto
      e' difendibile. L'autore e' esplicito sulla provenienza anche degli
      altri dataset che confronta, il che e' un buon segno.
    archiviazione: locale
    percorso: data/nomi/popular-names/common-surnames-by-country.csv
    sha256: 32cb28bea558a9d353feeef097da03c6488a4e7ba9398e5983cee2f0b9caa91c
    copertura: {geo: "75 paesi", tempo: 2023}
    universo: >-
      cognomi PIU' DIFFUSI per paese, con forma localizzata e romanizzata
      e, dove disponibile, il conteggio. 2.278 cognomi da 75 paesi,
      «generally at least 10 each per country».
      L'UNIVERSO DICHIARATO DALL'AUTORE E' IL TESTING DEL SOFTWARE:
      «I need a names dataset for doing some software testing», e i
      criteri sono quelli dell'internazionalizzazione — avere esempi CJK
      e RTL, con romanizzazione. NON e' costruito per rappresentare una
      popolazione.
      Per il nostro uso va bene lo stesso: serve un repertorio di
      PLAUSIBILITA' per rendere naturale un persona-prompt, non una
      distribuzione. Ma la differenza va dichiarata.
    unita: cognome
    normalizzatore: onomastico_csv
    opzioni: {col_paese: Country, col_chiave: "Romanized Name",
              col_alt: "Localized Name", col_peso: Count}
    anomalie:
      - >-
        i NOMI coprono 106 paesi, i COGNOMI solo 75, e l'intersezione e'
        65. Un nome arabo con cognome fiorentino — «Mohamed Innocenti» —
        e' PEGGIO di due nomi italiani, perche' segnala l'errore invece
        di nasconderlo: il raccordo `paesi_onomastici.yaml` include
        quindi SOLO i paesi coperti da entrambi.
      - >-
        la profondita' varia di un ordine di grandezza: Filippine 50
        cognomi, Albania 46, Cina 40, ma Romania 12, Moldova 15, India 7,
        Bangladesh 6. E la Romania e' il 13,8% degli stranieri di Parma:
        con dodici cognomi, in un campione da venti la collisione e'
        circa il 10% — accettabile — ma in uno da centoventi e' quasi
        certa.
      - >-
        il conteggio c'e' «when available», e per molti paesi manca. Il
        normalizzatore riporta `con_peso` e `senza_peso`; dove manca si
        estrae uniformemente.
      - >-
        la romanizzazione, dove non fornita dalla fonte, viene da Google
        Translate (dichiarato dall'autore). Per i paesi che ti servono e'
        raramente rilevante — sono quasi tutti in alfabeto latino o
        cirillico — ma per il cinese lo e'.
      - >-
        `Norvegia: NO` nel raccordo va fra virgolette: senza, YAML lo
        legge come il booleano false.
    bias: >-
      COPERTURA 59,6% degli stranieri, misurata su Parma (34.429
      stranieri, 136 paesi distinti). Il 40,4% ripiega su
      `cognome_italiano`, e la traccia lo dichiara.
      Il buco NON e' casuale: e' il mondo arabo e l'Africa subsahariana —
      Nigeria 6,7%, Tunisia 6,0%, Marocco 3,7%, Ghana 3,5%, Pakistan
      3,0%, Costa d'Avorio 2,9%, Senegal 2,2%, Camerun 2,2%. Sono paesi
      per cui ne' Wikipedia ne' gli istituti statistici nazionali
      pubblicano liste onomastiche, quindi la lacuna e' della letteratura
      aperta, non di questo dataset. Forebears.io li ha ma non e' open
      data.
      La coda europea recupera otto punti rispetto ai soli primi paesi:
      Spagna, Francia, Russia, Brasile, Colombia, Polonia e una trentina
      di altri sono coperti.
    usabile_per: [repertorio_cognomi_stranieri, plausibilita_onomastica]
    usato_da: [gsp.nomi]
    non_usabile_per: [statistiche_onomastiche, distribuzioni,
                      africa_subsahariana, mondo_arabo]

