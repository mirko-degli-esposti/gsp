                 F: 5c3e6356-df9f-4e19-aacc-ff51b5f505af}
    archiviazione: locale
    percorso: data/nomi/modena_nomi_{istanza}.csv
    chiave_istanza: sesso
    riferimento_temporale: 31_dicembre
    universo: >-
      STOCK dei residenti anagrafici del comune di Modena, NON i nati
      dell'anno: la descrizione del catalogo dice "attribuiti ai nati" ma
      i valori lo smentiscono (1.390 ANTONIO nel 2015 non sono neonati).
      Esattamente 50 nomi per sesso e per anno, 650 righe per file.
      Non distingue eta' ne' cittadinanza: e' una lista unica per sesso,
      ed e' la ragione per cui il repertorio dichiara `condiziona:
      [sesso]` e non `[sesso, coorte]`.
    unita: individuo
    copertura: {geo: "036023", tempo: "2012-2024"}
    normalizzatore: distribuzione_csv
    opzioni: {sep: ",", col_chiave: nome, col_peso: occorrenze,
              dimensioni: [anno]}
    anomalie:
      - >-
        il TITOLO dice "dal 2012 al 2022" ma i dati arrivano al 2024
        (13 annate, verificato 3/8/2026). Il nome del dataset e' rimasto
        indietro rispetto agli aggiornamenti.
      - >-
        il catalogo descrive il dataset come nomi "attribuiti ai nati":
        e' errato, sono lo stock dei residenti.
      - >-
        servito da un WFS di GeoServer, quindi il CSV porta quattro
        colonne di servizio che non c'entrano con i nomi: FID, OBJECTID,
        DATA_INS, SHAPE. `SHAPE` e' un POINT (1652000 4945000) IDENTICO
        su tutte le righe — il centroide di Modena, messo li' perche' il
        servizio pretende una geometria.
      - >-
        i due file hanno metadati CKAN di eta' diversa: il campo `hash`
        contiene un timestamp in millisecondi, che da' 2023-03-13 per il
        maschile e 2025-08-27 per il femminile. Sono due pubblicazioni
        separate, non due meta' di un export unico.
      - >-
        gli access url differiscono anche nel namespace WFS: `Modena:`
        per il maschile, `Modena_public:` per il femminile, piu' un
        doppio slash in `geoservernext//` nel primo. Da tenere presente
        se un giorno si automatizza il ri-scaricamento.
      - >-
        DATA_INS mostra due ondate di inserimento: le righe fino al 2022
        sono del 2023-03-10, quelle successive del 2025-04-22.
    bias: >-
      fonte MODENESE usata per tutti i comuni. A differenza dei cognomi
      fiorentini la scelta e' regionalmente coerente per dieci comuni su
      dodici: resta discutibile per Brescia (Lombardia) e per il comune
      pugliese.
      Il troncamento a 50 nomi per anno significa che la distribuzione
      sintetica e' piu' CONCENTRATA di quella vera: nessun nome raro
      comparira' mai, e la coda e' assente per costruzione, non per
      soppressione. Per rendere naturale un persona-prompt e'
      irrilevante; per qualunque statistica sui nomi no.
      Non condiziona sull'eta': un ottantenne puo' chiamarsi Lorenzo e un
      bambino Silvano. La correzione richiede una fonte per coorte, che
      ISTAT pubblica solo dal 1999 (Contanomi, e solo i primi 50
      nazionali o i primi 10 regionali). Per il 1927-1998 non esistono
      fonti regionali aperte: la via pulita e' chiedere a un ufficio
      statistica comunale una tavola sesso x classe quinquennale di
      nascita x nome x frequenza, con soppressione sotto 5 — e'
      un'aggregazione non identificativa.
    usabile_per: [repertorio_nomi]
    usato_da: [gsp.nomi]
    non_usabile_per: [condizionamento_per_coorte, cittadinanza,
                      statistiche_sui_nomi, geografia]

  # Medie nazionali della batteria AVQ — DERIVATO.
#
# Sostituire il blocco `avq_medie_nazionali` gia' presente in
# fonti/registro.yaml (quello era una bozza incompleta: mancavano unita,
# normalizzatore, usabile_per, non_usabile_per, e il percorso puntava a
# data/riferimenti/ invece che a fonti/derivati/).
#
# Richiede normalizzatori.py (28736) con `riferimenti_json` e
# fonti_init.py (33360).
#
#   python -m gsp.fonti --impronta avq_medie_nazionali
#   python -m gsp.fonti --verifica

  - id: avq_medie_nazionali
    ente: GSP (derivato)
    titolo: Medie nazionali della batteria AVQ
    url: null                   # non esiste una pagina: e' un derivato
    data_accesso: 2026-08-04
    licenza: CC-BY-4.0
    attribuzione: >-
      Elaborazione propria su ISTAT, "Aspetti della vita quotidiana -
      microdati ad uso pubblico", CC BY 4.0
    archiviazione: git
    percorso: fonti/derivati/medie_nazionali.json
    sha256: 435123b2f825a49100612608e42acb8db8d649eee80605688372e199f849a6ac
    copertura: {geo: "IT", tempo: 2024}
    derivato_da: [avq_microdati]
    prodotto_da: scripts/riferimenti/medie_nazionali.py
    universo: >-
      medie ponderate nazionali delle 23 variabili AVQ, calcolate dai
      microdati con i pesi COEFIN, universo 15 anni e piu' (ETAMi >= 5),
      ciascuna sull'universo della propria variabile.
      NON esiste una fonte ISTAT equivalente: la batteria di fiducia non
      e' pubblicata in forma aggregata. Le cinque medie che erano cablate
      nel viewer venivano da un'origine mai identificata (§13.6 punto 7
      del riferimento, chiuso il 2/8/2026); ricalcolate coincidono entro
      0,045 con quelle cablate, e ora ne coprono ventitre invece di
      cinque.
      Il file si autodescrive: porta `fonte`, `metodo`, `avvertenza`,
      `anni`, `eta_min_ETAMi` e `fattore_grappolo`, e il normalizzatore
      li riporta nell'impronta — chi la legge sa come e' stato calcolato
      senza aprire il registro.
    unita: media ponderata
    normalizzatore: riferimenti_json
    anomalie:
      - >-
        `n_misurato` sono le MODALITA' (23), non una somma: sommare delle
        medie non significa niente. Il normalizzatore lo dichiara e
        l'impronta usa quel valore invece della somma dei pesi.
      - >-
        l'artefatto NON contiene la data di generazione, di proposito:
        stessi dati in ingresso -> stesso file byte per byte. Con un
        timestamp dentro, l'sha256 divergerebbe a ogni esecuzione anche
        senza che i numeri cambino, e un controllo che diverge sempre e'
        un controllo che si smette di guardare. La data di produzione sta
        in `data_accesso` e nel mtime del file.
    bias: >-
      essendo un DERIVATO eredita da avq_microdati tutto cio' che la
      riguarda: la licenza, la perturbazione per la tutela della
      riservatezza gia' applicata da ISTAT, e il caveat che le
      elaborazioni sui file ad uso pubblico «possono condurre a risultati
      in qualche misura difformi rispetto a quelli pubblicati».
      Quindi NON sono stime ufficiali e non vanno confrontate con
      pubblicazioni ISTAT: sono il riferimento interno rispetto al quale
      la popolazione sintetica si misura.
      Ogni variabile porta con se' la propria precisione: `se` e
      soprattutto `se_grappolo`, corretto per l'effetto di grappolo
      dell'indagine (piu' rispondenti nella stessa famiglia non sono
      osservazioni indipendenti). E' `se_grappolo` il numero da usare per
      le tacche del pannello: `se` da solo sottostima.
    usabile_per: [riferimento_nazionale_batteria, tacche_pannello]
    usato_da: [animarium]
    non_usabile_per: [stime_ufficiali, confronto_con_pubblicazioni_istat,
                      riferimento_regionale]# Geodata — le due famiglie regionali, registrate come ZIP.
