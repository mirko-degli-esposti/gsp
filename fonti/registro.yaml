    riferimento_temporale: 31_dicembre
    universo: >-
      censimento permanente, stranieri residenti al 31 dicembre per paese
      di cittadinanza (~150 paesi). Pubblicato SOLO a livello comunale:
      e' la ragione per cui la pipeline assume paese indipendente dalla
      geografia dato (area, sesso), e per cui le fonti sub-comunali in
      data/submun/ sono complementari e non alternative (margine A
      dell'IPF in opendata_paese.py). Il grezzo contiene gli aggregati.
    unita: individuo
    normalizzatore: sdmx_csv
    blocco: nationality_conditional.csv
    vincolo: fuori_maxent
    obbligatoria: true
    anno_usato: N-1
    legge: build_constraints.py legge il file _decoded.csv, derivato dal _raw registrato qui applicando le codelist SDMX.
    nota_pipeline: >-
      produce P(paese | straniero) a due stadi, FUORI dal MaxEnt. DA
      CHIARIRE: la tupla la etichetta 'C6', che pero' e' gia'
      condprof_citizenship.
    usabile_per: [vincoli_maxent, margine_A_ipf, assegnazione_paese, registro_paesi]
    usato_da: [build_constraints.py, opendata_paese.py, assign_nationality.py, enrich.py, common.py]
    non_usabile_per: [geografia_subcomunale, popolazione_italiana]

