# Da appendere UNA VOLTA SOLA a fonti/registro.yaml. Forma sicura:
#   grep -q "id: brescia_cittadinanza" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/schede_opendata.yaml" >> fonti/registro.yaml
#
# PRINCIPIO: la configurazione operativa (loader, livello geografico,
# encoding, override dei nomi, mappe di riconciliazione, alias dei paesi)
# vive gia' in gsp.common.COMUNI[<cod>]["opendata_paese"]. Il registro NON
# la riscrive: la referenzia con `parametri_da`, e --verifica controlla
# che il riferimento regga. Riscriverla darebbe due dichiarazioni della
# stessa cosa, destinate a divergere in silenzio.
#
# Qui c'e' solo cio' che a common.py manca: provenienza, licenza,
# data di accesso, universo, limiti d'uso.
#
# Le altre cinque schede si ricavano da questa cambiando id, ente,
# percorso, tipo (`file` se non ci sono istanze), normalizzatore, tier
# e universo. I codici: 034027 Parma (tier 3), 035033 Reggio (tier 1,
# encoding latin-1, fonte 2013), 037006 Bologna (tier 2, Parquet),
# 039014 Ravenna (XLS, due annate), 040012 Forli' (XLSX, 41 unita' -> 21).

