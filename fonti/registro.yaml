      "Popolazione residente straniera per cittadinanza, sesso, quartiere
      e zona — serie storica", opendata.comune.bologna.it, CC BY 4.0
    nota_licenza: >-
      dichiarata nella scheda del dataset. Le condizioni generali del
      portale rimandano al singolo dataset: «Puoi utilizzare i dati
