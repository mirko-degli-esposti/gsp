    tier: 1
    universo: >-
      residenti stranieri per nazionalita' e circoscrizione, fonte
      ANAGRAFICA comunale. Matrice larga: nazionalita' sulle righe, le 4
      circoscrizioni sulle colonne. Non distingue il sesso: lo
      ricostruisce l'IPF dal margine comunale, come per Brescia.
