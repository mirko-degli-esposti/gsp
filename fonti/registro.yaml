      fonte usabile. Il residuo dichiarato "Altre nazionalita'" pesa 1.928 persone su
      31.431, cioe' il 6,1%: le 25 nazionalita' nominate coprono il 93,9%
      degli stranieri, quindi la fonte e' quasi completa e non una
      graduatoria troncata.
