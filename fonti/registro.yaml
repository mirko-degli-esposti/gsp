    url_download: https://esploradati.istat.it/databrowser/DWL/censtatv5db/Popolazione/DICA_TITSTUDIO-data.zip
    dataflow: DF_BULK_CPO2011_DICA_TITSTUDIO
    data_accesso: 2026-08-04
