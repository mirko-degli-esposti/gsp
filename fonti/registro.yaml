      `sezioni_2023_non_nello_shapefile.csv` in ogni cartella regionale.
    unita: sezione di censimento
    normalizzatore: archivio_zip
    anomalie:
      - >-
        ISTAT ha revisionato le sezioni di BOLOGNA e FORLI' — due degli
        undici comuni — in un rilascio successivo alla prima diffusione
        delle BT 2021. Se il download precede la revisione, le geometrie
        di quei due comuni non sono l'ultima versione. Da verificare
        confrontando la data del file con quella del rilascio.
      - >-
        il registro verifica lo ZIP, NON l'estratto che la pipeline legge
        (`gsp.common.REGIONI[reg]["shp"]` punta a
        R??_21/SHP/R??_21_WGS84.shp). Se qualcuno modificasse l'estratto,
        `--verifica` non se ne accorgerebbe. Con file da 80 MB non
        succede a mano, ma va detto.
      - >-
        i nomi dei file NON sono uniformi fra istanze: R03, R08, R16 sono
        i codici regione ISTAT. Il pattern usa `*` accanto a `{istanza}`,
        e solo quest'ultima entra nella chiave.
