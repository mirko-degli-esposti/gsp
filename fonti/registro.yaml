# cancellabile, e la pipeline lo legge tramite i percorsi dichiarati in
# gsp.common.REGIONI. Il backup delle fonti geografiche passa cosi' da
# 1,7 GB a 230 MB, e `--verifica` non deve calcolare l'hash di mezzo giga.

