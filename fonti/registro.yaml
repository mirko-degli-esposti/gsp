        i due file hanno metadati CKAN di eta' diversa: il campo `hash`
        contiene un timestamp in millisecondi, che da' 2023-03-13 per il
        maschile e 2025-08-27 per il femminile. Sono due pubblicazioni
        separate, non due meta' di un export unico.
