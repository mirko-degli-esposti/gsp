      un'inferenza corretta ma di natura diversa da una licenza letta.
    attribuzione: >-
      ISTAT, "Basi territoriali e variabili censuarie", CC BY 4.0
    archiviazione: locale
    percorso: data/geodata/{istanza}/R*_21.zip
    chiave_istanza: regione
    parametri_da: common.REGIONI
    universo: >-
      geometrie delle sezioni di censimento, edizione 2021, in WGS84.
      Una regione per istanza: R03 Lombardia, R08 Emilia-Romagna,
      R16 Puglia.
      E' la GEOMETRIA, non i dati: i conteggi per sezione stanno in
      `istat_sezioni_2023`, che ha edizione dei dati 2023 su geometria
