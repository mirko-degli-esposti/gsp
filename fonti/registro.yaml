  - id: avq_microdati
    tipo: multi_istanza
    ente: ISTAT
    titolo: Aspetti della vita quotidiana - microdati per la ricerca (mIcro.STAT)
    url: https://www.istat.it/microdati/aspetti-della-vita-quotidiana/
    url_note_legali: https://www.istat.it/note-legali/
    url_normativa_microdati: https://www.istat.it/dati/microdati/normativa/
    data_accesso: 2026-08-03
    licenza: CC-BY-4.0
    licenza_uri: https://creativecommons.org/licenses/by/4.0/
    attribuzione: >-
      ISTAT, "Aspetti della vita quotidiana - microdati ad uso pubblico",
      istat.it, CC BY 4.0
    nota_licenza: >-
      licenza INFERITA, non letta: la pagina AVQ non ne dichiara una
      propria, e si applica quella generale del sito ("salvo diversa
      indicazione", note legali). Verificato il 3/8/2026 dentro lo zip di
      tutte e tre le annate: il !Leggimi qualifica i file come "ad uso
      pubblico" — la classe meno restrittiva, scaricabile senza contratto
      a differenza di MFR e SUF — e ne' esso ne' i quattro PDF dei
      metadati pongono condizioni d'uso, divieti di ridistribuzione o
      clausole sulla reidentificazione.
      La CC-BY consente esplicitamente l'adattamento, quindi la
      popolazione sintetica che ne deriva e' ridistribuibile citando la
      fonte. La RISERVATEZZA e' un asse diverso dalla licenza: vedi
      nota_riservatezza.
    nota_riservatezza: >-
      i file ad uso pubblico sono gia' sottoposti da ISTAT al trattamento
      per la tutela della riservatezza, dichiarato nel !Leggimi: «a causa
      del trattamento dei dati per la tutela della riservatezza, le
      elaborazioni effettuate sui file ad uso pubblico possono condurre a
      risultati in qualche misura difformi rispetto a quelli pubblicati».
      La protezione e' incorporata NEL DATO, non affidata a una clausola
      d'uso — ed e' la stessa ragione per cui le stime dalla popolazione
      sintetica non coincidono con quelle ufficiali per costruzione.
      La popolazione sintetica aggiunge uno strato: ogni vettore AVQ e'
      replicato ~40 volte su individui diversi (4.617 donatori su 184.597
      individui a Modena), quindi nessuna combinazione e' unica. Cio' che
      resta reale nel record e' il VETTORE di risposte di un rispondente
      gia' perturbato, mai la sua identita' ne' la sua geografia.
      La popolazione sintetica che ne deriva e' diffusa secondo tre regimi
      dichiarati (note/piano_trattamento_v1.md §4): il vettore AVQ compare
      nel bundle pubblico, ma senza nome ne' indirizzo, e ogni vettore e'
      replicato ~40 volte su individui diversi — nessuna combinazione e'
      unica. E' il vettore AVQ, non l'indirizzo, la componente piu' reale
      del record: sono le risposte di un rispondente vero, gia' perturbato
      da ISTAT.
    archiviazione: locale
    percorso: data/avq/anni/avq{istanza}/MICRODATI/AVQ_Microdati_{istanza}.txt
    chiave_istanza: anno
    riferimento_temporale: anno_indagine
    metadati: avq{istanza}/METADATI/
    universo: >-
      campione dell'indagine multiscopo sulle famiglie, individui
      residenti in famiglia (esclusi i conviventi in istituto).
      Unita' CAMPIONARIA, non individuo: ogni record porta COEFIN,
      coefficiente di riporto all'universo, e rappresenta se stesso piu'
      altri COEFIN-1. n_misurato registra i RECORD, perche' e' cio' che la
      pipeline consuma - il pool di donatori e' fatto di record, non di
      pesi. somma_pesi e n_eff_kish stanno nell'impronta e non vanno
      confusi con n.
    unita: individuo campionario
    normalizzatore: avq_microdati
    opzioni: {scala_peso: 10000}
    cella_condizionamento: [REGMf, SESSO, ETAMi->macroeta, ISTRMi->istr4]
    uso: >-
      assign_avq.py impila le annate normalizzando COEFIN ENTRO ANNO
      (w = COEFIN / somma COEFIN dell'anno): ogni annata pesa 1/n
      indipendentemente dalla propria numerosita'. Dentro ogni cella il
      donatore e' estratto con probabilita' proporzionale a w, e si copia
      il VETTORE COMPLETO dei target - e' questo che preserva le
      correlazioni fra variabili, non il campionamento per variabile.
    nota_pool: >-
      il pool effettivo dipende dai TARGET richiesti, non e' un numero
      fisso: un'annata che non ha una variabile fra i target viene
      scartata per intero. Con CRONI fra i target il 2022 esce e il pool
      resta a due annate (verificato 1/8/2026: MALAT non e' un
      rinominamento di CRONI, e' vuota nel 99,99% dei casi). Le variabili
      OPZIONALI restano invece NaN dove assenti, cosi' il modulo a
      rotazione non dimezza il pool.
    da_chiarire: >-
      (1) equipesare le annate implica un pool che rappresenta una media
      del triennio e non la popolazione a una data: per l'uso come
      donatori di attributi e' probabilmente irrilevante, ma non e' stato
      verificato. (2) numero di donatori effettivamente
      ESTRATTI: non ancora misurato, assign_avq.py non lo stampa
      (verificato 2/8/2026, la nota che diceva il contrario era errata).
      Serve sia per separare collisioni da saturazione incompleta, sia
      perche' la maschera a 100 donatori nella validazione 2 e' oggi
      calcolata sui donatori DISPONIBILI e non su quelli estratti.
    usabile_per: [pool_donatori_hot_deck, attributi_AVQ]
    usato_da: [assign_avq.py]
    non_usabile_per: [conteggi_comunali, stime_dirette_subregionali,
                      vincoli_maxent, condizionamento_per_taglia_comune]
    bias: >-
      n_eff di Kish nazionale, per annata: 31.015 (2022), 31.386 (2023),
      34.154 (2024) su 42.022 / 41.750 / 45.005 record — rapporto ~0,74,
      i pesi bruciano poca informazione. Il condizionamento su
      (regione, sesso, macroeta', istr4) porta n_eff a 1.520 per Modena e
      1.599 per Bologna: un fattore VENTI, ed e' la stratificazione a
      costarlo, non i pesi. E' 1.520, non 8.111, il numero da citare
      accanto a una statistica AVQ della popolazione sintetica.
      Il file ad uso pubblico e' prodotto dall'MFR per sottocampionamento
      e ne eredita struttura e trattamento delle variabili, ma NON la
      classe di ampiezza demografica del comune (verificato 3/8/2026 sul
      tracciato 2024: assente). Il condizionamento geografico si ferma
      quindi alla REGIONE: Bologna con 390.098 abitanti e Castenaso con
      16.357 attingono allo stesso pool di 4.629 donatori
      emiliano-romagnoli. E' il limite territoriale della fonte, ed e' la
      ragione per cui `distanza dalla composizione comunale` misura la
      geografia del PAESE ma non quella degli attributi AVQ.
    anomalie:
      - >-
        COEFIN e' memorizzato come INTERO con quattro decimali impliciti:
        senza scala_peso=10000 la somma dei pesi e' 5,8e11 invece di
        5,8e7. Il !Leggimi avverte di verificare il separatore decimale
        indicato nel tracciato.
      - >-
        record dichiarati nel !Leggimi e misurati dall'impronta
        coincidono: 42.022 per il 2022 (verificato 2/8/2026).
      - >-
        i microdati sono PERTURBATI per la tutela della riservatezza: il
        !Leggimi avverte che le elaborazioni sui file ad uso pubblico
        possono dare risultati difformi da quelli pubblicati da ISTAT.
        Per donare attributi e' probabilmente irrilevante, ma le stime
        non coincidono con le ufficiali per costruzione.

