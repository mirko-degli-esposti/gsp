    archiviazione: locale
    percorso: data/comuni/{istanza}/cens_migr_backg_raw.csv
    chiave_istanza: comune
    riferimento_temporale: 31_dicembre
    universo: >-
      censimento permanente, popolazione residente al 31 dicembre per
      background migratorio e origine dei genitori. E' la fonte del
      blocco GC (background x cittadinanza), che contiene 6 zeri
      strutturali: senza un vincolo congiunto esplicito il MaxEnt assume
      indipendenza anche dove la relazione e' deterministica, e produce
      ~30% di combinazioni impossibili. Gli stessi zeri rendono la catena
      di Gibbs riducibile a lambda*. Il grezzo contiene gli aggregati.
    unita: individuo
    normalizzatore: sdmx_csv
    blocco: C7/C8 (c7_sex_background.csv, c8_background_origine.csv)
    vincolo: soft
    obbligatoria: false
    anno_usato: N-1
    legge: build_constraints.py legge il file _decoded.csv, derivato dal _raw registrato qui applicando le codelist SDMX.
    nota_pipeline: >-
      opzionale: se manca, preflight() salta i blocchi e lo dichiara. C8 ha
      'non_applicabile' per i nati all'estero.
    usabile_per: [vincoli_maxent, blocco_GC]
    usato_da: [build_constraints.py, cs_build.py]
    non_usabile_per: [confronto_diretto_con_anagrafe_stesso_anno]

