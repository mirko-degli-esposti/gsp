# Caratteristiche dell'attività lavorativa — censimento 2011.
#
#   grep -q "id: cens2011_caratt_attl" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/scheda_caratt_attl.yaml" >> fonti/registro.yaml
#
#   python scripts/riempi_sha.py
#   python -m gsp.fonti --impronta cens2011_caratt_attl
#   python -m gsp.fonti --verifica
#   python -c "import gsp.lavoro as L; L.verifica()"

  - id: cens2011_caratt_attl
    ente: ISTAT
    titolo: >-
      Caratteristiche dell'attività lavorativa - Censimento della
      popolazione 2011
    url: https://esploradati.istat.it/databrowser/
    url_storico: http://dati-censimentopopolazione.istat.it/
    url_download: https://esploradati.istat.it/databrowser/DWL/censtatv5db/Popolazione/DICA_CARATT_ATTL-data.zip
    nota_url: >-
      il file e' stato scaricato dal data warehouse dedicato al 15°
      Censimento generale (2011), che l'11/8/2026 risponde con un
      redirect 302 verso esploradati.istat.it/databrowser/. Il vecchio
      URL si conserva perche' e' quello da cui il dato proviene e da cui
      viene il prefisso DICA_ dei file; chi rifacesse il download oggi
      passerebbe dal databrowser, sotto `censpop`.
    dataflow: DF_BULK_CPO2011_DICA_CARATT_ATTL
    data_accesso: 2026-08-05
    licenza: CC-BY-4.0
    attribuzione: >-
      ISTAT, "15° Censimento generale della popolazione e delle
      abitazioni 2011", CC BY 4.0
    archiviazione: locale
    percorso: data/censimento_2011/DICA_CARATT_ATTL-data.zip
    sha256: 111272116ef8bb1f1d66f27411bfb853e9dc2fb847debb41e20bb01fd931f11c
    copertura: {geo: "IT, ripartizioni, regioni, 25 comuni", tempo: 2011}
    universo: >-
      OCCUPATI (`TIPO_DATO = EMPLP`) per caratteristiche dell'attività
      lavorativa. Quattordici dimensioni: ATECO_2007 (1988 voci, dalle
      sezioni alle sottocategorie), PROFILO_PROF, OCCUPAZIONE, ETA1,
      TITOLO_STUDIO, SEXISTAT1, STATCIV2, ISO1, ITTER107, REGIME_ORARIO,
      CARATT_OCC, DURATA.
      Il registro la usa per la COPPIA CONGIUNTA settore × posizione
      professionale, condizionata su sesso e territorio: 21 sezioni
      ATECO × 6 profili × 2 sessi, con tutte le altre dimensioni al
      totale. A Parma 246 celle su 294 possibili, nessuna a zero,
      mediana 78 occupati.
      I sei profili sono una partizione vera: dipendenti · imprenditore e libero professionista · 
      lavoratore in proprio · coadiuvante familiare · socio di cooperativa · parasubordinato.
      Molto meglio del `dipendente/indipendente` a due modalità di
      `c9_sex_posizione_prof.csv`, che questa scheda rende superfluo.
    unita: individuo occupato
    normalizzatore: archivio_zip
    prodotto_da: null
    anomalie:
      - >-
        il file dati è UTF-8 SENZA intestazione: le quattordici dimensioni
        vanno identificate dai VALORI, confrontandoli con le codelist del
        pacchetto METADATA. Assegnarle a occhio ha già prodotto un errore
        — `OCCUPAZIONE` letta come `ATECO_2007`, perché entrambe hanno
        codici alfabetici — e tutte le misure sono state rifatte. Il
        metodo corretto è per contenimento: l'insieme dei valori di una
        colonna deve essere sottoinsieme di una sola codelist.
      - >-
        I CODICI «TOTALE» NON SONO UNIFORMI fra dimensioni: `ALL` per
        occupazione e cittadinanza, `99` per profilo, titolo e stato
        civile, `0010` per ateco, `9` per sesso e regime orario, `TOTAL`
        per durata. Chi ne assume uno solo filtra via tutto.
      - >-
        L'INCROCIO SETTORE × TITOLO DI STUDIO a livello comunale esiste
        SOLO per la sezione A, agricoltura (verificato 5/8/2026: con
        titolo specificato le sezioni disponibili nei sei comuni sono
        `['A']`, con titolo al totale sono tutte e ventuno). Sarebbe
        stato il condizionamento più informativo — TVD 0,105-0,390 — ed è
        la ragione per cui la derivazione usa sesso e comune invece del
        titolo.
      - >-
        Stessa forma, altro punto: alcuni titoli di studio hanno UN SOLO
        supporto pubblicato, sempre agricoltura, e davano TVD di 0,954 —
        vicinissima al massimo teorico. Non era un segnale ma un
        artefatto: confrontare una composizione su 1 supporto con una su
        21 non misura nulla. Contare i supporti PRIMA di confrontare le
        distanze.
      - >-
        SETTE SEZIONI SU VENTUNO non sono incrociate con il titolo di
        studio: D energia, E acqua e rifiuti, H trasporti, J informazione
        e comunicazione, L immobiliare, M attività professionali, N
        servizi alle imprese. Sono il 15,9% degli occupati e includono i
        servizi digitali e professionali, dove i laureati si concentrano:
        le TVD misurate per l'istruzione sono quindi un LIMITE INFERIORE.
      - >-
        `OCCUPAZIONE` (11 grandi gruppi CP — «attività operaia
        qualificata», «lavoro esecutivo d'ufficio») sarebbe la variabile
        più forte per una biografia, ma ha solo 1.208 righe con valore
        specificato e NESSUN comune. Utilizzabile al più come
        `P(occup | istruzione, sesso)` nazionale.
      - >-
        `DURATA` (tempo determinato / indeterminato / stagionale) ha ZERO
        righe con valore specificato: non è incrociata con nulla. Peccato,
        perché per la fiducia istituzionale sarebbe stata rilevante.
      - >-
        `ATECO_2007` mescola sezioni (codici di UNA lettera, A-U) e
        aggregati (codici numerici `0010`-`0093`, «totale industria»,
        «totale servizi»). Usarli insieme produce una composizione che
        somma a più di uno. Il filtro corretto è `len(codice) == 1`.
      - >-
        il dataflow SDMX è di tipo ONLY_FILE con VIRTUALDSD: NON è
        interrogabile per dimensioni. L'URL dello zip sta
        nell'annotazione ATTACHED_DATA_FILES della struttura.
      - >-
        I PROFILI FORMANO UN ALBERO CHE IL CODEBOOK NON DICHIARA: la
        quarta colonna sembra un padre ma è l'ordinamento (10, 20, 30…
        430). Ricostruito dai conteggi:
        99 totale = 9 + 22 + 42; 22 indipendenti = 41 + 15 + 18 + 19;
        41 = 11 + 12. Tenere aggregati e componenti insieme conta due
        volte le stesse persone — la somma dei nove codici presenti fa il
        140% del totale.
        E i due livelli NON coincidono: `11 imprenditore` e `12 libero
        professionista` esistono solo nelle righe di totale, mentre nella
        congiunta con l'ateco compare solo il loro aggregato `41`.
        Escluderlo perdeva 8.265 occupati a Parma, il 10%.
    bias: >-
      LA COPPIA VA ESTRATTA INSIEME. `ateco` e `profilo` sono fortemente
      dipendenti: la distanza in variazione totale fra la congiunta
      osservata e il prodotto delle sue marginali è 0,149 a Parma, 0,166 a Bologna, 
      0,156 in Emilia-Romagna. Stabile su cinque territori, quindi
      struttura e non rumore. Estrarli separatamente produrrebbe dirigenti
      in agricoltura e coadiuvanti familiari nella pubblica
      amministrazione. È la stessa ragione per cui l'hot-deck AVQ copia il
      vettore intero.
      IL RIPIEGO REGIONALE NON COSTA UGUALE. Sei comuni su undici sono
      nella tavola (Parma, Modena, Bologna, Brescia, Reggio Emilia,
      Ravenna); gli altri cinque leggono la regione. La distanza del
      comune dalla propria regione va da 0,029 di Ravenna a 0,159 di
      Bologna: il ripiego costa poco dove il comune è ordinario e molto
      dove è particolare, cioè proprio dove servirebbe.
      NIENTE ETA' nel condizionamento: fra i 30 e i 55 anni la TVD è
      0,03-0,08, indistinguibile dal rumore. Conta solo agli estremi
      (0,12-0,20), dove i ventenni si concentrano in commercio e
      ristorazione e i sessantenni nei settori in uscita.
      CITTADINANZA E SETTORE non sono mai incrociati: `ISO1` è sempre al
      totale quando l'ATECO è specificato. L'assunzione di indipendenza
      non è verificabile qui. Una parte dell'effetto passa comunque
      indirettamente, perché gli stranieri hanno una distribuzione
      d'istruzione diversa.
      LA FONTE HA QUINDICI ANNI e la struttura settoriale italiana è
      cambiata: crescita dei servizi digitali, contrazione della
      manifattura.
      # nella scheda, campo bias
      LA RIPONDERAZIONE NON ARRIVA AL 21,4% DEGLI OCCUPATI di Parma
      (misurato 5/8/2026): le sette sezioni escluse dall'incrocio con il
      titolo — D energia, E acqua e rifiuti, H trasporti, J informazione
      e comunicazione, L immobiliare, M attività professionali, N servizi
      alle imprese — mantengono la distribuzione indipendente dal titolo.
      È una scheda su cinque, e sono proprio le sezioni dove il titolo
      conterebbe di più.
    
    usabile_per: [settore_posizione_congiunta, derivazione_a_valle]
    usato_da: [gsp.lavoro]
    non_usabile_per: [vincoli_maxent, condizionamento_per_titolo_comunale,
                      durata_contratto, articolazione_subcomunale]
# Rilevazione sulle unioni civili — scheda per fonti/registro.yaml
#
#   grep -q "id: istat_unioni_civili_2023" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/scheda_unioni_civili.yaml" >> fonti/registro.yaml
#
#   python -m gsp.fonti --impronta istat_unioni_civili_2023
#   python -m gsp.fonti --verifica
#
# TRE CAMPI DA CONTROLLARE prima di appendere, perche' non li conosco:
#   data_accesso    ho messo la data di oggi
#   normalizzatore  vedi la nota in fondo alla scheda
#   percorso        {n} presuppone file «Tavola_1.1.xls»: se i nomi
#                   scaricati sono diversi, va corretto

  - id: istat_unioni_civili_2023
    tipo: multi_istanza
    chiave_istanza: tavola
    ente: ISTAT
    titolo: Rilevazione sulle unioni civili — Anno 2023
    url: https://demo.istat.it/tavole/?t=unionicivili
    data_accesso: 2026-08-07
    licenza: CC-BY-4.0
    licenza_uri: https://creativecommons.org/licenses/by/4.0/
    attribuzione: >-
      ISTAT, "Rilevazione sulle unioni civili - Anno 2023",
      demo.istat.it, CC BY 4.0
    archiviazione: locale
    percorso: data/istat/unioni_civili/2023/Tavola_{istanza}.xls
    copertura: {geo: "Italia, regioni, grandi comuni", tempo: 2023}
    tavole_usate:
      - "1.1 indicatori sintetici regionali"
      - "1.2 unioni per sesso e stato civile degli uniti"
      - "1.5 unioni costituite nei grandi comuni"
      - "2.11 unioni per regione di RESIDENZA degli uniti"
    universo: >-
      Indagine individuale ed ESAUSTIVA di fonte Stato Civile, istituita
      nel 2018, su tutte le unioni civili fra coppie dello stesso sesso
      della popolazione presente.
      Sono FLUSSI ANNUALI, non stock: la tavola dice quante unioni sono
      state costituite nel 2023, non quante ne esistono. Lo stock si
      stima cumulando dal giugno 2016, quando la legge e' entrata in
      vigore — con le riserve dichiarate in `anomalie`.
    unita: unione civile costituita nell'anno
    normalizzatore: nessuno
    anomalie:
      - >-
        LA TAVOLA 1.1 CONTA PER COMUNE DI COSTITUZIONE, non di residenza,
        e sovrastima la popolazione residente unita del 12-13%:
        Emilia-Romagna 315 contro 273, Lombardia 708 contro 621. Per i
        residenti va usata la 2.11, ed e' la ragione per cui entrambe
        sono nell'elenco delle tavole usate.
      - >-
        L'EFFETTO CAPOLUOGO NON E' SEPARABILE con questi dati. Bologna
        risulta a 15,9 unioni per 100.000 contro 7,08 del dato regionale
        (tav. 1.5), ma e' costituzione e non residenza: parte del divario
        e' attrazione per la cerimonia — ci si unisce dove si vuole, non
        dove si abita — e parte e' composizione reale della popolazione
        residente. Con le tavole pubblicate le due non si distinguono.
      - >-
        SONO FLUSSI E LO STOCK VA STIMATO, con due distorsioni note e di
        segno concorde:
        il flusso non e' stato costante — picco di circa 4.400 nel 2017,
        l'anno dopo l'entrata in vigore, quando si sono unite le coppie
        che aspettavano da anni — quindi moltiplicare il 2023 per 8,5
        anni sovrastima del ~5%;
        e ignorare gli scioglimenti (1,4% degli uniti nel 2023) sovrastima
        di un altro punto o due.
        Il valore fedele sarebbe ~0,0037. Si usa 0,004 dichiarando
        l'incertezza, perche' la terza cifra non e' sostenuta dal dato.
    derivati:
      P_STESSO_SESSO_UNITI:
        valore: 0.004
        significa: >-
          quota di coppie dello stesso sesso sul totale delle coppie
          unite da un vincolo formale (matrimoni + unioni civili) fra i
          residenti
        metodo: >-
          stock stimato cumulando i flussi 2016-2023 dalla tavola 2.11,
          che conta per RESIDENZA, diviso il totale delle coppie
          coniugate o unite. Sovrastima di circa il 6% per le due ragioni
          dichiarate in `anomalie`.
        incertezza: >-
          il valore fedele e' ~0,0037; la seconda cifra e' solida, la
          terza no
      P_MASCHILE_UNITI:
        valore: 0.56
        significa: >-
          quota di unioni fra uomini sul totale delle unioni civili
          costituite (tav. 1.2)
    bias: >-
      IL DATO E' SULLE UNIONI CIVILI, NON SULLE COPPIE DELLO STESSO SESSO.
      Le coppie conviventi non unite civilmente non compaiono, e sono
      verosimilmente piu' numerose di quelle unite: la quota di 0,004
      misura quindi le coppie FORMALIZZATE, non la prevalenza
      dell'orientamento ne' della convivenza.
      Per una popolazione sintetica questo e' il dato giusto se il vincolo
      da riprodurre e' lo stato civile — che e' un fatto amministrativo —
      e quello sbagliato se si volesse rappresentare le coppie di fatto.
      IL LIVELLO TERRITORIALE UTILE E' LA REGIONE. La 1.5 scende ai
      grandi comuni ma per costituzione, quindi non e' usabile per la
      residenza (vedi anomalie). Ne segue che la quota e' identica per
      tutti i comuni della stessa regione, come per gli attributi AVQ.
    usabile_per: [coppie_stesso_sesso, stato_civile_nucleo]
    usato_da: [gsp.nucleo]
    non_usabile_per: [coppie_di_fatto, orientamento_sessuale,
                      dettaglio_comunale, stock_diretto]

# SUL NORMALIZZATORE. Le tavole di demo.istat.it sono .xls con
# intestazioni multiriga e note in coda: nessuno dei normalizzatori
# esistenti le legge. Tre opzioni, in ordine di costo:
#
#   1. `normalizzatore: nessuno` e i valori trascritti a mano nei `derivati`
#      — e' quello che la scheda fa adesso. Va bene perche' dalla fonte
#      si estraggono DUE NUMERI, non una distribuzione: il costo di un
#      normalizzatore non si ripaga;
#   2. un `tavola_xls` che legge un foglio dichiarando riga di
#      intestazione e colonne, se un domani servissero piu' tavole;
#   3. trascrivere le quattro tavole in un csv derivato e registrarlo a
#      parte con `derivato_da: [istat_unioni_civili_2023]`.
#
# Con `null` il registro non puo' verificare che i numeri corrispondano
# al file: e' un limite, e va saputo. Il controllo resta l'impronta
# sha256, che dice se il file e' cambiato ma non se la trascrizione e'
# giusta.
# Repertorio delle configurazioni di nucleo — scheda per fonti/registro.yaml
#
# PRIMA DI APPENDERE, due controlli:
#
#   python -c "
#   import yaml
#   d = yaml.safe_load(open('fonti/registro.yaml'))
#   ids = {x['id'] for x in d['fonti']}
#   for i in ('parma_microdati_residenti','avq_microdati',
#             'istat_unioni_civili_2023'):
#       print(f'  {i:<34} {\"ok\" if i in ids else \"MANCA\"}')"
#
#   ls note/nota_repertorio_avq_v3.md
#
# L'id della fonte parmense era `parma_popolazione_residente_2025`, che
# nel registro NON esiste: quella dei microdati individuali di Parma si
# chiama `parma_microdati_residenti`. Corretto qui — ma se la coda venisse
# da un altro file, va rimesso l'id giusto, perche' un `derivato_da` che
# punta al nulla fa protestare --verifica.
#
#   grep -q "id: repertorio_nuclei_v1" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/scheda_repertorio_nuclei.yaml" >> fonti/registro.yaml
#
#   python -m gsp.fonti --impronta repertorio_nuclei_v1
#   python -m gsp.fonti --verifica

  - id: repertorio_nuclei_v1
    tipo: derivato
    titolo: Repertorio delle configurazioni di nucleo familiare
    ente: GSP (derivato)
    url: null
    data_accesso: 2026-08-11
    copertura:
      geo: "Emilia-Romagna e Lombardia; la coda da Parma"
      tempo: 2024
    normalizzatore: repertorio_json
    percorso: data/repertorio_nuclei_v1.json
    sha256: 4ef2b2978f640a88c0952831afc445eb78e5c0b62c0886d55cb532ea880a74bc
    generato_da: gsp.nucleo.costruisci_repertorio
    generato_il: 2026-08-10
    archiviazione: locale
    licenza: >-
      derivata: CC-BY-4.0 dalle fonti ISTAT, con l'attribuzione che
      `fonti/ATTRIBUZIONI.md` genera per ciascuna
    derivato_da:
      - id: avq_microdati
        anni: [2022, 2023, 2024]
        regioni: [80, 30]
        fornisce: >-
          firme (P(configurazione | ampiezza), 8.443 nuclei), quota
          maschile del riferimento per firma, divario generazionale
          riferimento-figlio, divario fra fratelli, omogeneita' della
          cittadinanza
        nota: >-
          include il 2022, che il pool dell'anello 2 esclude per l'assenza
          di CRONI: quella e' una variabile target e alla struttura
          familiare non serve. NON filtra ISTRMi=99, perche' scartare un
          componente mutila il nucleo.
      - id: parma_microdati_residenti
        fornisce: >-
          la CODA, cioe' P(ampiezza) oltre 6 componenti
        nota: >-
          l'AVQ ha 86 nuclei oltre l'ampiezza 6 contro le migliaia di
          Parma. Per la coda la numerosita' conta piu' della copertura
          regionale. E' l'unico pezzo del repertorio che viene da un
          SINGOLO COMUNE, ed e' la sua fragilita' meno visibile.
      - id: istat_unioni_civili_2023
        fornisce: [P_STESSO_SESSO_UNITI, P_MASCHILE_UNITI]
    parametri_convenzionali:
      PARTNER_MAX_DIFF:
        valore: 15
        stato: NON MISURATO
        perche: >-
          le classi ETAMi sono larghe 5-10 anni e non risolvono il divario
          reale fra partner (~3 anni in Italia). L'AVQ da' mediana 0, che
          significa «stessa classe», non «stessa eta'». Parma ha l'eta'
          esatta ma nessun identificativo di famiglia, quindi non puo'
          supplire. Da sostituire col SUF EU-SILC.
      GENITORE_MIN: {valore: 20, stato: PER ANALOGIA}
      GENITORE_MAX:
        valore: 40
        stato: PER ANALOGIA
        perche: >-
          presi dal divario generazionale rovesciato. La misura diretta ha
          n=175 con il 45% nella classe aperta 75+, dove il centro e' una
          convenzione. E' il parametro piu' debole del repertorio, e il
          collaudo lo conferma: «G fuori dai limiti» e' il secondo
          ripiego per frequenza in tutti e tre i comuni provati.
    trasferibilita: >-
      Il repertorio e' emiliano-lombardo e la coda e' parmense, ma viene
      applicato a tutti gli undici comuni. Assunzione gemella della (6)
      sull'anello 2. VERIFICATA su Parma, Bologna e Brescia: Bologna e'
      migliore di Parma su ogni indicatore e Brescia, fuori regione, perde
      meno di due punti. Nessuna verifica sui comuni piccoli.
    universo: >-
      Configurazioni di nucleo familiare con le loro probabilita'
      condizionate all'ampiezza, piu' i parametri che governano
      l'assegnazione delle eta' e della cittadinanza dentro il nucleo.
      NON e' una distribuzione di famiglie: e' un repertorio di forme con
      i pesi, da cui `assembla` pesca.
    unita: configurazione di nucleo
    bias: >-
      TRE NUMERI SU CINQUE NON SONO MISURATI. `PARTNER_MAX_DIFF`,
      `GENITORE_MIN` e `GENITORE_MAX` sono convenzioni o analogie, e
      entrano nella popolazione come se fossero dati. Il campo `stato` li
      distingue apposta: chi legge il JSON generato non avrebbe altro
      modo di sapere quali cifre sono misurate e quali no.
      Il piu' debole e' `GENITORE_MAX`, e si vede nel collaudo: «G fuori
      dai limiti» e' il secondo ripiego per frequenza su tutti e tre i
      comuni provati. Un ripiego frequente e' il sintomo di un parametro
      sbagliato, non del caso.
      LA CODA VIENE DA UN COMUNE SOLO. Le ampiezze oltre 6 sono rare
      ovunque, e prenderle da Parma significa assumere che le famiglie
      numerose di Brescia o Rimini abbiano la stessa distribuzione di
      quelle parmensi. Non e' verificato, e non lo sara' finche' un altro
      comune non pubblichi microdati individuali con la famiglia.
    usabile_per: [struttura_nucleo, assegnazione_ruoli, coppie]
    usato_da: [gsp.nucleo, scripts/attributi/assign_nucleo.py]
    non_usabile_per: [statistiche_familiari, distribuzione_famiglie,
                      comuni_piccoli_non_verificati]
    documentato_in: note/nota_repertorio_avq_v3.md

# TRE COSE CHE HO AGGIUNTO ALLA BOZZA, e perche'.
#
# `sha256: DA_CALCOLARE`. Anche un derivato ha l'impronta: e' cio' che
# distingue «rigenerato uguale» da «rigenerato diverso», e senza non si
# saprebbe se una popolazione nuova usi lo stesso repertorio di quella
# vecchia. `scripts/riempi_sha.py` lo calcola dal percorso dichiarato.
#
# `usabile_per` / `non_usabile_per`. Il registro li richiede su tutte le
# schede, e qui il secondo dice la cosa importante: il repertorio serve a
# costruire nuclei, NON a fare statistiche sulle famiglie. Sono due usi
# che si confondono facilmente, perche' il file contiene delle
# probabilita' e sembra una distribuzione.
#
# Un `bias` esplicito. `parametri_convenzionali` dice quali numeri non
# sono misurati, ma non dice CHE COSA COMPORTA. Il bias lo esplicita, e
# aggiunge l'osservazione che vale la pena tenere: un ripiego frequente
# nel collaudo e' il sintomo di un parametro sbagliato, non del caso.
# EU-SILC — due schede, perche' sono due oggetti con statuto diverso.
#
#   grep -q "id: eusilc_puf_it" fonti/registro.yaml \
#     && echo "GIA' PRESENTE" \
#     || cat "$SCAR/scheda_eusilc.yaml" >> fonti/registro.yaml
#
#   python scripts/riempi_sha.py
#   python -m gsp.fonti --verifica | tail -3
#
# COSA HO AGGIUNTO alla bozza: i campi che il registro pretende su OGNI
# scheda — `data_accesso`, `copertura`, `normalizzatore`, `licenza`. Sono
# gli stessi che hanno fatto fallire `repertorio_nuclei_v1`: il registro
# non controlla i VALORI — il vocabolario di `usabile_per` e' libero, cento
# etichette molte delle quali usate una volta sola — ma controlla i CAMPI.
#
# `dati_sintetici`, `sostituito_da`, `riferimenti_usati` e `grezzo` non
# sono mai stati usati: il registro li ignora senza protestare, quindi
# vanno bene ma NON sono validati. Un refuso non verrebbe segnalato.

  - id: eusilc_puf_it
    tipo: multi_istanza
    chiave_istanza: annata_file
    percorso: data/eu-silc/puf/IT_{istanza}_EUSILC.csv
    ente: Eurostat
    titolo: EU-SILC Public Use File — Italia
    url: https://ec.europa.eu/eurostat/web/microdata/public-microdata/statistics-on-income-and-living-conditions
    data_accesso: 2026-08-05
    licenza: >-
      accesso pubblico previa accettazione del disclaimer; NON e' una
      licenza aperta e non consente la ridistribuzione. Il testo e'
      conservato in `Disclaimer_SILC.txt` accanto ai dati.
    archiviazione: locale
    grezzo: data/eu-silc/IT_PUF_EUSILC.zip
    copertura: {geo: "Italia, NUTS2 (DB040)", tempo: "2004-2013"}
    unita: "quattro file per annata: D e H per famiglia, R e P per persona"
    universo: >-
      DIECI ANNATE, quaranta CSV. Nomi con la lettera del file MINUSCOLA.
      Cifre di riferimento per il 2013: D 18.487, H 18.487, R 43.489,
      P 37.209. Il file R ha 25 colonne.
    normalizzatore: nessuno
    dati_sintetici: true
    anomalie:
      - >-
        I DATI SONO COMPLETAMENTE SINTETICI per dichiarazione Eurostat.
        Non sono osservazioni: sono simulati con modelli statistici a
        partire dalle distribuzioni dei dati originali. Il disclaimer e'
        piu' stretto della formula «dati sintetici»: esclude
        esplicitamente le «relationships between different personal or
        household characteristics», quindi anche le correlazioni e i
        divari fra membri della stessa famiglia.
      - >-
        LE VARIABILI DI PARENTELA NON CI SONO. RB220 (padre), RB230
        (madre), RB240 (partner) sono documentate come cross-sezionali nel
        SUF ma assenti dal PUF, e cosi' PB160/PB170/PB180 nel file P:
        rimosse per riservatezza. Il disclaimer afferma che la struttura
        del PUF e' la stessa del SUF, e su questo punto e' inesatto.
        Conseguenza: il parser dei puntatori si scrive ma non si collauda.
      - >-
        NESSUN FLAG. Le colonne `_F`, che sul SUF dicono se un valore e'
        osservato, imputato o mancante, sono omesse perche' prive di
        interpretazione su dati simulati.
      - >-
        RB030 NON E' UNIVOCO: almeno due record nella stessa famiglia
        condividono l'identificativo. Sul SUF la stessa anomalia, se
        presente, renderebbe AMBIGUI i puntatori di parentela, che
        contengono l'id sorgente. Vedi eusilc_exploration §5.1.
      - >-
        ROTAZIONE LONGITUDINALE: le stesse famiglie ricompaiono per
        quattro anni consecutivi. Impilare le dieci annate senza
        deduplicare creerebbe famiglie duplicate — la stessa trappola di
        PROFAM nell'AVQ (v22 §13.5).
    bias: >-
      E' LA FONTE CON IL RISCHIO D'USO IMPROPRIO PIU' ALTO DEL REGISTRO, e
      per una ragione che nessun campo tecnico cattura: **i numeri
      sembrano dati**. Un CSV con 43.489 righe, colonne dai nomi ufficiali
      e valori plausibili non ha nulla che avverta chi lo apre. Il nome del
      file non lo dice, l'estensione non lo dice, e una media calcolata su
      quelle righe esce con tre cifre decimali come qualunque altra.
      Chi lo usasse per una stima otterrebbe un numero verosimile e
      sbagliato, senza che nulla segnali l'errore. Da cui
      `non_usabile_per` piu' lungo del solito, e `dati_sintetici: true`
      come campo a se': se un domani arrivassero altre fonti simulate, la
      categoria e' filtrabile invece che sepolta in una nota.
    usabile_per: [sviluppo_codice, esplorazione_struttura,
                  preparazione_richiesta_suf]
    non_usabile_per: [stima, calibrazione, validazione, divari_eta,
                      grafo_parentela, qualunque_inferenza]
    usato_da: [scripts/diagnostica/eusilc_grafo.py]
    documentato_in: note/eusilc_exploration_v3.md
    sostituito_da: >-
      EU-SILC Scientific Use File, da richiedere. Motivazione strutturata
      in eusilc_exploration_v3 §12.

  - id: eusilc_target_variables_2013
    tipo: documentazione
    ente: Eurostat
    titolo: >-
      EU-SILC Description of Target Variables — SILC065, operation 2013,
      version May 2013
    url: https://circabc.europa.eu/sd/a/d7e88330-3502-44fa-96ea-eab5579b4d1e/SILC065%20operation%202013%20VERSION%20MAY%202013.pdf
    data_accesso: 2026-08-05
    licenza: >-
      documento pubblico Eurostat su CIRCABC, senza licenza esplicita.
      Citabile e conservabile; la ridistribuzione non e' dichiarata.
    archiviazione: locale
    percorso: "data/eu-silc/SILC065 operation 2013 VERSION MAY 2013.pdf"
    sha256: 753f599718889eb9d653080860a09e52fae526863d1bf7487f12ec6f724374d3
    copertura: {geo: "UE", tempo: 2013}
    unita: definizione di variabile
    universo: >-
      Definizione ufficiale di tutte le variabili target EU-SILC:
      contenuto, unita', periodo di riferimento, e se la variabile sia
      cross-sezionale, longitudinale o entrambe.
    normalizzatore: nessuno
    bias: >-
      NON E' UN DATASET ma la fonte da cui il progetto ha tratto le
      affermazioni sulla struttura di EU-SILC. Serve a rispondere alla
      domanda «da dove risulta che RB220 e' cross-sezionale?» — e la
      risposta e' pagina 144.
      Va conservato perche' il PDF su CIRCABC puo' cambiare URL o sparire,
      e con esso la giustificazione di quanto scritto nelle note.
    riferimenti_usati:
      - "p. 78: quali record stanno nei file D/R/H/P"
      - >-
        pp. 144-146: RB220, RB230, RB240 — cross-sectional and
        longitudinal, incluse «in order to calculate the household
        composition»
      - "pp. 252-254: PB160, PB170, PB180, le stesse nel file P"
    usabile_per: [decodifica_variabili_eusilc, documentazione_struttura]
    usato_da: [note/eusilc_exploration_v3.md]
    non_usabile_per: [dati, conteggi, stime]

# UNA COSA CHE VALE OLTRE QUESTE DUE SCHEDE
#
# `tipo: documentazione` e' un valore nuovo: venti schede usano `tipo`, ma
# con altri valori. Il registro non lo valida, quindi passa — ed e' una
# categoria che mancava e serviva.
#
# Il registro fin qui conteneva solo DATI. Ma una fonte di dati senza la
# sua documentazione e' meta' fonte: le anomalie del PUF sono state
# scoperte confrontando i file con il PDF, e senza quel confronto
# «RB220 e' assente» sarebbe stata una constatazione invece di una
# discrepanza fra cio' che il dato dichiara e cio' che contiene.
