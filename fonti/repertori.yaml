# Repertori onomastici — configurazione, non codice.
#
# Un REPERTORIO e' una fonte del registro piu' la dichiarazione di cosa
# condiziona. Cambiare sorgente significa cambiare `fonte`: il generatore
# legge le colonne dichiarate e non sa da dove vengano.
#
# `condiziona: []`     lista unica
# `condiziona: [x, y]` il frame normalizzato deve avere le colonne x e y,
#                      e il generatore le usa per scegliere il sottoinsieme
schema: 1

repertori:

  - id: cognome_italiano
    tipo: cognome
    fonte: firenze_cognomi_2013
    condiziona: []
    pesato: true
    bias: >-
      cognomi FIORENTINI usati per tutta l'Emilia-Romagna e per Brescia.
      Scelta dichiarata, non corretta: TOLOMELLI, primo ad Argelato, non
      compare in 375.371 fiorentini, e INNOCENTI (terzo a Firenze) e' un
      artefatto dell'Ospedale degli Innocenti. Da sostituire con una
      fonte anagrafica emiliana quando disponibile: bastera' cambiare
      `fonte` qui.

# --- da compilare -------------------------------------------------------
# I repertori seguenti non hanno ancora una fonte registrata. Finche'
# `fonte` e' DA_REGISTRARE il generatore lo dichiara e ripiega secondo
# `fallback`.

  - id: cognome_straniero
    tipo: cognome
    fonte: popular_names_cognomi
    condiziona: [paese]
    traduci: {paese: paesi_onomastici.yaml}
    pesato: false
    fallback: cognome_italiano
    bias: >-
      copre 59,6% degli stranieri (misurato su Parma). Il resto ripiega
      su cognome_italiano, e la traccia lo dichiara. Il buco e'
      concentrato nel mondo arabo e nell'Africa subsahariana — Nigeria,
      Tunisia, Marocco, Ghana, Pakistan, Costa d'Avorio, Senegal,
      Camerun — che ne' Wikipedia ne' gli istituti nazionali documentano.
      NON pesato anche dove la fonte avrebbe i conteggi: con 10-50 voci
      per paese l'uniforme e' indistinguibile, a differenza dei cognomi
      italiani dove la coda lunga rende il peso essenziale.

  - id: nome_italiano
    tipo: nome
    fonte: modena_nomi_residenti
    condiziona: [sesso]
    filtro: {anno: 2024}
    pesato: true
    fallback: null
    bias: >-
      Contanomi ISTAT copre solo le coorti dal 1999 (tre bin su otto,
      ~30% della popolazione). Per le altre serve una fonte comunale sui
      RESIDENTI, o un repertorio curato per decennio.

  - id: nome_straniero
    tipo: nome
    fonte: popular_names_nomi
    condiziona: [paese, sesso]
    traduci: {paese: paesi_onomastici.yaml}
    pesato: false
    fallback: nome_italiano
    bias: >-
      stessa fonte e stessa copertura dei cognomi: 65 paesi, 59,6% degli
      stranieri (misurato su Parma, verificato su 400 individui: 59,2%).
      Il vincolo che nome e cognome cadano INSIEME e' nel raccordo
      `paesi_onomastici.yaml`, che include solo i paesi coperti da
      entrambi — la fonte ne avrebbe 106 per i nomi ma un nome arabo su
      un cognome fiorentino segnala l'errore invece di nasconderlo.
      Il sesso c'e' nella colonna `Gender` (F/M), quindi il
      condizionamento e' pieno: senza, un uomo con nome femminile sarebbe
      piu' visibile di un cognome sbagliato.

  - id: cognome_maghreb
    tipo: cognome
    fonte: cognomi_wiki_MA_ARAB
    condiziona: []
    pesato: false
    fallback: cognome_italiano
    bias: >-
      repertorio MAROCCHINO esteso a Tunisia e Algeria per prossimita'
      linguistica: i cognomi arabo-berberi del Maghreb condividono la
      stessa matrice, e Ben Ali o El Amrani funzionano in tutta l'area.
      NON e' una fonte per la Tunisia: e' una fonte marocchina usata
      anche altrove, e la differenza va detta. Il Marocco ha una
      componente berbera che Tunisia e Algeria hanno in misura minore,
      quindi l'estensione e' imperfetta in quella direzione.
      Non esteso a Egitto e Levante, dove l'onomastica araba diverge.
      Non pesato: una categoria di Wikipedia e' un ELENCO, non una
      distribuzione.

  

  - id: cognome_yoruba
    tipo: cognome
    fonte: cognomi_wiki_NG_YORUBA
    condiziona: []
    pesato: false
    fallback: cognome_italiano
    bias: >-
      cognomi YORUBA usati per tutta la Nigeria. Gli yoruba sono circa il
      20% della popolazione nigeriana, accanto a igbo (18%) e hausa
      (30%): usarli per tutti sovrarappresenta un gruppo su tre.
      La scelta e' obbligata: le categorie Wiktionary per igbo e hausa
      esistono ma hanno 6 e 3 voci — appena abbozzate — mentre quella
      yoruba ne ha 107 ed e' curata.
      NON esteso a Ghana, Camerun o altri paesi subsahariani: i
      repertori akan, ewe e mandinga sono diversi, e «Adebayo Diop» per
      un senegalese sarebbe come «Giuseppe Andersen» per un norvegese.


# Instradamento: il cognome segue il PADRE, il nome dipende dai genitori.
# Ordine significativo: si applica la prima regola che combacia.
regole:
  cognome:
    - se: {background: [italiano_nativo, italiano_rientrato]}
      usa: cognome_italiano
    - se: {origine_genitori: [madre_straniera_padre_italiano]}
      usa: cognome_italiano
    - se: {cittadinanza: [ITL]}
      usa: cognome_italiano
    - se: {paese: [Marocco, Tunisia, Algeria]}
      usa: cognome_maghreb
    - se: {paese: [Nigeria]}
      usa: cognome_yoruba
    - se: {}
      usa: cognome_straniero
  nome:
    - se: {background: [italiano_nativo, italiano_rientrato]}
      usa: nome_italiano
    - se: {origine_genitori: [madre_italiana_padre_straniero,
                              madre_straniera_padre_italiano]}
      usa: nome_italiano
    - se: {}
      usa: nome_straniero
