[project]
name = "gsp"
version = "0.1.0"
description = "Popolazioni sintetiche generative"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyarrow", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
